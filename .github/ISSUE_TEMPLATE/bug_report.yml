name: Bug report
description: Something does not work the way it should.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. For a security problem, do not use this form.
        Report it privately at
        https://github.com/druxt/druxt.js/security/advisories/new instead.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you see, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: >
        The smallest set of steps that shows the problem. A link to a repository
        or a starter kit that reproduces it is the fastest route to a fix.
      placeholder: |
        1. Install ...
        2. Visit ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: versions
    attributes:
      label: Versions
      description: Druxt, Nuxt, Drupal, Node, and the package manager.
      placeholder: |
        druxt: 0.24.0
        nuxt: 2.17.3
        drupal: 11.4.4
        node: 16.18.1
        npm: 8.19.2
      render: text
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or errors
      description: Browser console, terminal output, or the Drupal log.
      render: shell
    validations:
      required: false
